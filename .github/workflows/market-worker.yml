name: Market Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: arbitrageve-data-maintenance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESI_BASE_URL: https://esi.evetech.net
      ESI_USER_AGENT: ${{ secrets.ESI_USER_AGENT }}
      MARKET_REFRESH_MINUTES: "5"
      MARKET_REFRESH_MIN_MINUTES: "5"
      MARKET_REFRESH_MAX_MINUTES: "1440"
      MARKET_REFRESH_REFERENCE_ORDERS: "50000"
      MARKET_REFRESH_ORDER_EXPONENT: "0.5"
      MARKET_MAX_REGIONS_PER_RUN: "2"
      MARKET_REGION_PRIORITY: "The Forge,Domain,Sinq Laison,Heimatar,Metropolis,Essence,Tash-Murash,Everyshore"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install .

      - name: Refresh stale market regions
        run: python scripts/market_worker.py

      - name: Validate persistent market data
        run: python scripts/healthcheck.py
