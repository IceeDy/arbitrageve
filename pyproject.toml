[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrageve"
version = "0.2.0"
description = "EVE Online market arbitrage scanner"
requires-python = ">=3.13"
dependencies = [
  "requests>=2.32",
  "SQLAlchemy>=2.0",
  "streamlit>=1.50",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
